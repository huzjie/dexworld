apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexworld
  labels:
    app: dexworld
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dexworld
  template:
    metadata:
      labels:
        app: dexworld
    spec:
      containers:
        - name: dexworld
          image: huzjie/dexworld:latest
          ports:
            - containerPort: 8765
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
